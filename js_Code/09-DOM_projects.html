    <!DOCtype html>
    <html>
        <head>
            <title>DOM projects</title>
        </head>
        <body> 
            <p>YouTube Subscribe Button</p>
            <button
            onclick="
            subscribe();
            " class="js-subscribe-button">   Subscribe</button>
        <p>Amazon Shipping Calculator</p>
            <input type="number" class="js-cost" placeholder="Cost of Order" onkeydown=" handlecosetkeydown(event);
            ">
            <!-- Every event listener gets an event object -->
            <button onclick="calculateTotal();
            // clicks,keydowns=>events
            // onclick,onkeydown(any value from keyboard)=>event listeners

            
            ">Calculate</button>
            <p class="js-total-cost"></p>
         
<script>
    
    function handlecosetkeydown(event){

            if (event.key==='Enter'){
                calculateTotal();  

            }
    }
    function calculateTotal(){
        const inputelement = document.querySelector('.js-cost')
        let cost = Number(inputelement.value);//to get value typed in input (.value returns string)
         
        if (cost<40){
            cost = cost + 10;

        }
        document.querySelector('.js-total-cost').innerHTML =
        `$${cost}`;

    }
    function subscribe(){
        const btnelement = document.querySelector('.js-subscribe-button')
            if (btnelement.innerText==='Subscribe'){
                btnelement.innerHTML='Subscribed';
            }
            // innerText removes extra space
            else{
                btnelement.innerHTML='Subscribe'
            }

    }
     
    

</script>

        </body>
    </html>
